name: F02 SQL Server integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sql-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build exact SSR bundle and browser for SQL-to-SSR tests
        working-directory: frontend
        env:
          NG_BUILD_MAX_WORKERS: "1"
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Run disposable SQL Server and required integrity suite
        shell: bash
        run: |
          set -euo pipefail
          SQL_PASSWORD="F02!$(openssl rand -hex 24)"
          echo "::add-mask::$SQL_PASSWORD"
          export MSSQL_SA_PASSWORD="$SQL_PASSWORD"
          docker run -d --name f02-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server@sha256:2b5b581621126574f3d1f75e78d3eebe8d05aedb59ad0cfdf9aa42cb0634d726
          trap 'docker rm -f f02-sql' EXIT
          ready=0
          for attempt in {1..60}; do
            if docker logs f02-sql 2>&1 | grep -q 'SQL Server is now ready for client connections'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          # Plain transport is restricted to loopback in this disposable test job.
          export F02_SQL_CONNECTION="Server=localhost,1433;User ID=sa;Password=$SQL_PASSWORD;Encrypt=false"
          export CHROME_PATH="$(cd frontend && node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          dotnet tool restore
          dotnet restore backend/DigitalMenu.slnx --locked-mode
          dotnet build backend/DigitalMenu.slnx -c Release --no-restore
          dotnet ef migrations has-pending-model-changes --project backend/src/DigitalMenu.Infrastructure
          dotnet ef migrations script --idempotent --project backend/src/DigitalMenu.Infrastructure --output migration.sql
          dotnet test backend/DigitalMenu.slnx -c Release --no-build --logger trx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: persistence-evidence
          path: |
            migration.sql
            backend/tests/**/TestResults/*.trx
            frontend/.lighthouseci/s01-*
