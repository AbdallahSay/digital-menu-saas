name: F01 foundation gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NG_BUILD_MAX_WORKERS: "1"
      F01_LOCAL_ONLY: "1"
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend locked restore, build, format and tests
        run: |
          dotnet restore backend/DigitalMenu.slnx --locked-mode
          dotnet build backend/DigitalMenu.slnx -c Release --no-restore
          dotnet format backend/DigitalMenu.slnx --verify-no-changes --no-restore
          dotnet test backend/DigitalMenu.slnx -c Release --no-build --logger trx
          dotnet list backend/DigitalMenu.slnx package --vulnerable --include-transitive --format json > backend/advisories.json
          node -e "const r=require('./backend/advisories.json');for(const p of r.projects??[])for(const f of p.frameworks??[])for(const d of [...(f.topLevelPackages??[]),...(f.transitivePackages??[])])for(const v of d.vulnerabilities??[])if(['High','Critical'].includes(v.severity))throw Error(d.id+': '+v.severity)"
      - name: Frontend locked install, audit, lint, unit tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test -- --watch=false
          npm run build
          npx playwright install --with-deps chromium
      - name: Raw HTTP, browser and Lighthouse gates against local production build
        shell: bash
        run: |
          set -euo pipefail
          SQL_PASSWORD="S01!$(openssl rand -hex 24)"
          echo "::add-mask::$SQL_PASSWORD"
          export MSSQL_SA_PASSWORD="$SQL_PASSWORD"
          docker run -d --name s01-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server@sha256:2b5b581621126574f3d1f75e78d3eebe8d05aedb59ad0cfdf9aa42cb0634d726
          trap 'docker rm -f s01-sql' EXIT
          ready=0
          for attempt in {1..60}; do
            if docker logs s01-sql 2>&1 | grep -q 'SQL Server is now ready for client connections'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          export F02_SQL_CONNECTION="Server=localhost,1433;User ID=sa;Password=$SQL_PASSWORD;Encrypt=false"
          export S01_FRONTEND_GATES=1
          export CHROME_PATH="$(cd frontend && node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          dotnet test backend/DigitalMenu.slnx -c Release --no-build --filter FullyQualifiedName~PublicSsrTests --logger trx --logger 'console;verbosity=detailed'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: foundation-evidence
          include-hidden-files: true
          path: |
            frontend/.lighthouseci/
            frontend/source.html
            frontend/ssr.log
            frontend/test-results/
            backend/tests/**/TestResults/
            backend/advisories.json
            api.log
